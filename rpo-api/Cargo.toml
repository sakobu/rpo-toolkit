[package]
name = "rpo-api"
description = "WebSocket API server for RPO mission planning"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license = "AGPL-3.0-or-later"

[dependencies]
rpo-core = { path = "../rpo-core" }
rpo-nyx = { path = "../rpo-nyx" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anise = { workspace = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
rpo-core = { path = "../rpo-core", features = ["test-fixtures"] }
rpo-nyx = { path = "../rpo-nyx", features = ["test-support"] }
hifitime = { workspace = true }
