[workspace]
members = ["rpo-core", "rpo-nyx", "rpo-cli", "rpo-api", "rpo-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sarkis Melkonian"]
repository = "https://github.com/sakobu/rpo-toolkit"

[workspace.dependencies]
anise = "0.9"
hifitime = "4"
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
